<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户管理 — 后台管理</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body data-page-id="admin-users">
    <a class="skip-link" href="#main-content">跳转到主要内容</a>
    <div class="app-layout">
      <aside class="sidebar sidebar-dark">
        <div class="sidebar-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>管理后台</span></div>
        <nav><ul class="sidebar-nav">
          <li><a href="./admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>仪表盘</a></li>
          <li><a href="./admin-users.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>用户管理</a></li>
          <li><a href="./admin-ai.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 12l7-7"/></svg>AI 配置</a></li>
        </ul></nav>
      </aside>

      <div class="main-wrapper">
        <header class="top-header">
          <div class="header-left"><h1>用户管理</h1></div>
          <div class="header-right">
            <a href="./index.html" class="btn btn-secondary" style="padding:0.3rem 0.75rem;font-size:0.75rem;">返回前台</a>
            <div class="user-avatar" style="background:var(--color-primary);">A</div>
          </div>
        </header>

        <main id="main-content" class="content-area" tabindex="-1">
          <section class="card" style="margin-bottom:1.5rem;">
            <div class="card-body" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
              <div class="header-search" style="flex:1;min-width:200px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="user-search" placeholder="搜索用户名或手机号…" style="padding:0.4rem 0.75rem;border:1px solid var(--color-border);border-radius:8px;font-size:0.82rem;width:100%;outline:none;" />
              </div>
              <select id="status-filter" style="padding:0.4rem 0.6rem;border:1px solid var(--color-border);border-radius:8px;font-size:0.82rem;">
                <option value="all">全部状态</option><option value="active">正常</option><option value="banned">已封禁</option>
              </select>
              <button class="btn btn-secondary" id="export-users-btn" style="padding:0.4rem 0.8rem;font-size:0.8rem;"> 导出用户</button>
            </div>
          </section>

          <section class="card">
            <div class="card-header"><h3>用户列表</h3><span id="user-count" class="badge badge-blue"></span></div>
            <div style="overflow-x:auto;">
              <table class="data-table">
                <thead><tr><th>ID</th><th>姓名</th><th>手机号</th><th>年龄</th><th>性别</th><th>健康评分</th><th>VIP</th><th>状态</th><th>注册日期</th><th>操作</th></tr></thead>
                <tbody id="user-tbody"></tbody>
              </table>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0 0;flex-wrap:wrap;gap:0.5rem;">
              <span id="user-page-info" style="font-size:0.8rem;color:var(--color-muted-text);"></span>
              <div style="display:flex;gap:0.5rem;" id="user-pagination"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- User Detail Modal -->
    <div id="user-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;justify-content:center;align-items:center;">
      <div style="background:#fff;border-radius:16px;padding:2rem;width:90%;max-width:550px;max-height:90vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <h3 style="margin:0;">用户详情</h3>
          <button onclick="document.getElementById('user-modal').style.display='none'" style="background:none;border:none;font-size:1.5rem;cursor:pointer;"></button>
        </div>
        <div id="user-detail-content"></div>
      </div>
    </div>

    <script src="./data-store.js"></script>
    <script>
    const USERS_PER_PAGE = 10;
    let userPage = 1;
    let filteredUsers = [];

    function init() {
      const users = DataStore.loadUsers();
      filteredUsers = [...users];
      document.getElementById('user-count').textContent = filteredUsers.length + ' 人';
      renderUsers();
    }

    function renderUsers() {
      const total = filteredUsers.length;
      const totalPages = Math.ceil(total / USERS_PER_PAGE);
      if (userPage > totalPages) userPage = totalPages || 1;
      const start = (userPage - 1) * USERS_PER_PAGE;
      const pageUsers = filteredUsers.slice(start, start + USERS_PER_PAGE);

      document.getElementById('user-tbody').innerHTML = pageUsers.map(u => `
        <tr>
          <td style="font-size:0.825rem;">${u.id}</td>
          <td style="font-size:0.825rem;font-weight:500;">${u.name}</td>
          <td style="font-size:0.825rem;">${u.phone}</td>
          <td style="font-size:0.825rem;">${u.age}</td>
          <td style="font-size:0.825rem;">${u.gender}</td>
          <td><span class="badge ${u.score>=80?'badge-green':u.score>=60?'badge-amber':'badge-red'}">${u.score}</span></td>
          <td>${u.vip?'<span class="badge badge-amber">VIP</span>':'-'}</td>
          <td>${u.status==='active'?'<span class="badge badge-green">正常</span>':'<span class="badge badge-red">封禁</span>'}</td>
          <td style="font-size:0.825rem;">${u.joined}</td>
          <td><button class="btn btn-secondary" style="padding:0.25rem 0.6rem;font-size:0.72rem;" onclick="viewUser(${u.id})">查看</button></td>
        </tr>`).join('');

      document.getElementById('user-page-info').textContent = `第 ${userPage} 页 / 共 ${totalPages} 页（${total} 人）`;
      let pg = `<button class="btn btn-secondary" style="padding:0.3rem 0.6rem;font-size:0.75rem;" ${userPage<=1?'disabled':''} onclick="goUserPage(${userPage-1})">上一页</button>`;
      for (let i = 1; i <= totalPages; i++) {
        pg += `<button class="btn ${i===userPage?'btn-primary':'btn-secondary'}" style="padding:0.3rem 0.5rem;font-size:0.75rem;min-width:2rem;" onclick="goUserPage(${i})">${i}</button>`;
      }
      pg += `<button class="btn btn-secondary" style="padding:0.3rem 0.6rem;font-size:0.75rem;" ${userPage>=totalPages?'disabled':''} onclick="goUserPage(${userPage+1})">下一页</button>`;
      document.getElementById('user-pagination').innerHTML = pg;
    }

    window.goUserPage = function(p) { userPage = p; renderUsers(); };

    window.viewUser = function(id) {
      const users = DataStore.loadUsers();
      const u = users.find(x => x.id === id);
      if (!u) return;
      const allData = DataStore.load();
      const userData = allData.filter(r => true); // all data belongs to current user
      document.getElementById('user-detail-content').innerHTML = `
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;font-weight:600;">${u.name[0]}</div>
          <div>
            <div style="font-size:1.1rem;font-weight:700;">${u.name}</div>
            <div style="font-size:0.8rem;color:var(--color-muted-text);">${u.phone} · ${u.gender} · ${u.age}岁</div>
          </div>
          ${u.vip?'<span class="badge badge-amber" style="margin-left:auto;">VIP</span>':''}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;">
          <div style="padding:1rem;background:var(--color-surface);border-radius:12px;">
            <div style="font-size:0.75rem;color:var(--color-muted-text);margin-bottom:0.25rem;">健康评分</div>
            <div style="font-size:1.5rem;font-weight:700;color:var(--color-primary);">${u.score}</div>
          </div>
          <div style="padding:1rem;background:var(--color-surface);border-radius:12px;">
            <div style="font-size:0.75rem;color:var(--color-muted-text);margin-bottom:0.25rem;">数据记录</div>
            <div style="font-size:1.5rem;font-weight:700;">${u.records}</div>
          </div>
          <div style="padding:1rem;background:var(--color-surface);border-radius:12px;">
            <div style="font-size:0.75rem;color:var(--color-muted-text);margin-bottom:0.25rem;">注册日期</div>
            <div style="font-size:1rem;font-weight:600;">${u.joined}</div>
          </div>
          <div style="padding:1rem;background:var(--color-surface);border-radius:12px;">
            <div style="font-size:0.75rem;color:var(--color-muted-text);margin-bottom:0.25rem;">账号状态</div>
            <div style="font-size:1rem;font-weight:600;">${u.status==='active'?'✅ 正常':' 封禁'}</div>
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;">
          <button class="btn btn-secondary" style="flex:1;justify-content:center;padding:0.6rem;" onclick="alert('已发送消息给 ${u.name}')">发送消息</button>
          <button class="btn ${u.status==='active'?'btn-danger':'btn-primary'}" style="flex:1;justify-content:center;padding:0.6rem;" onclick="toggleBan(${u.id})">${u.status==='active'?'封禁账号':'解封账号'}</button>
        </div>`;
      document.getElementById('user-modal').style.display = 'flex';
    };

    window.toggleBan = function(id) {
      const users = DataStore.loadUsers();
      const u = users.find(x => x.id === id);
      if (u) { u.status = u.status === 'active' ? 'banned' : 'active'; localStorage.setItem(DataStore.USERS_KEY, JSON.stringify(users)); }
      document.getElementById('user-modal').style.display = 'none';
      init();
    };

    // Search
    document.getElementById('user-search').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      const users = DataStore.loadUsers();
      filteredUsers = users.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q));
      userPage = 1;
      document.getElementById('user-count').textContent = filteredUsers.length + ' 人';
      renderUsers();
    });

    // Status filter
    document.getElementById('status-filter').addEventListener('change', function() {
      const users = DataStore.loadUsers();
      const q = document.getElementById('user-search').value.toLowerCase();
      filteredUsers = users.filter(u => {
        const matchSearch = u.name.toLowerCase().includes(q) || u.phone.includes(q);
        const matchStatus = this.value === 'all' || u.status === this.value;
        return matchSearch && matchStatus;
      });
      userPage = 1;
      document.getElementById('user-count').textContent = filteredUsers.length + ' 人';
      renderUsers();
    });

    // Export
    document.getElementById('export-users-btn').addEventListener('click', function() {
      let csv = '\uFEFFID,姓名,手机号,年龄,性别,健康评分,VIP,状态,注册日期,记录数\n';
      filteredUsers.forEach(u => {
        csv += `${u.id},${u.name},${u.phone},${u.age},${u.gender},${u.score},${u.vip?'是':'否'},${u.status==='active'?'正常':'封禁'},${u.joined},${u.records}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `用户数据_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    init();
    </script>
  </body>
</html>
